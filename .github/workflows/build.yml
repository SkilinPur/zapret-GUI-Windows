name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: |
          pip install --upgrade pip
          pip install -r gui/requirements.txt
          pip install pyinstaller

      - name: Smoke-импорты (без GUI)
        run: python -c "import gui.app.window, gui.app.win_backend, gui.app.mock_backend; print('imports ok')"

      - name: Сборка .exe
        run: python -m PyInstaller --clean --noconfirm gui.spec

      - name: Упаковка
        shell: bash
        run: |
          ls -la dist/
          mkdir -p release
          cp dist/ZapretGUI.exe release/ZapretGUI.exe
          cd release
          python -c "import zipfile,os; z=zipfile.ZipFile('zapret-GUI-Windows.zip','w',zipfile.ZIP_DEFLATED); z.write('ZapretGUI.exe'); z.close()"

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: zapret-GUI-Windows
          path: release/zapret-GUI-Windows.zip

      - name: Релиз (по тегу)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/release_notes.py "${{ github.ref_name }}" > notes.txt
          gh release create "${{ github.ref_name }}" release/zapret-GUI-Windows.zip \
            -R "${{ github.repository }}" --title "${{ github.ref_name }}" \
            --notes-file notes.txt
